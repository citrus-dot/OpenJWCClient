name: OpenJWC
options:
  bundleIdPrefix: org.openjwc
  deploymentTarget:
    # D6：iOS 18.0 baseline；iOS 26 Liquid Glass 走 if #available 增强
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  # 本地域层包（阶段 1–3 产出），app 经它传递依赖 GRDB/SwiftSoup
  OpenJWCCore:
    path: ../Packages/OpenJWCCore
  # D-3：Markdown 正文渲染
  MarkdownUI:
    url: https://github.com/gonzalezreal/MarkdownUI
    from: "2.4.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OpenJWC:
    type: application
    platform: iOS
    sources:
      - path: OpenJWC
        excludes:
          # 脚本资产单独以 folder reference 打包（D-5），避免 xcodegen 展开成散文件
          - "Resources/Sources"
      - path: OpenJWC/Resources/Sources
        type: folder
        buildPhase: resources
    dependencies:
      - package: OpenJWCCore
      - package: MarkdownUI
    info:
      path: OpenJWC/Info.plist
      properties:
        CFBundleDisplayName: OpenJWC
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 阶段 7a（D-1/D-2）：后台任务注册白名单 + 后台模式
        BGTaskSchedulerPermittedIdentifiers:
          - org.openjwc.newsrefresh
          - org.openjwc.dailyreport
        UIBackgroundModes:
          - fetch
          - processing
        # 阶段 7a 手验发现（阶段 4 遗留）：39 个源含 http 明文 URL，ATS 默认拦截致 -1022；
        # 对齐 Android 无明文限制语义（公开高校新闻站，域名杂无法逐域列白）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false

schemes:
  OpenJWC:
    build:
      targets:
        OpenJWC: all
